name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies (if package-lock.json exists)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json found — skipping npm ci"
          fi

      - name: Set up Python (for Python subagents)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (if requirements.txt exists)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found — skipping pip install"
          fi

      - name: Verify PostgreSQL client tools are available
        run: psql --version

      - name: Verify Docker is available
        run: docker --version

      - name: Verify GitHub CLI is available
        run: gh --version

      - name: Install Playwright browsers for E2E and design review agents
        run: npx --yes playwright install --with-deps chromium

      - name: Verify Playwright is available
        run: npx playwright --version
